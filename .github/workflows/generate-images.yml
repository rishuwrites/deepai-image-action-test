name: Generate 20 images

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Optional single-image prompt (leave blank to run the sample set)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-core

      - name: Generate images
        run: python generate_images.py
        env:
          IMAGE_PROMPT: ${{ inputs.prompt }}

      - name: Upload generated images and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepai-generated-images
          path: output/
          if-no-files-found: warn
          retention-days: 7
